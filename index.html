<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- [페이지 상단] 카페 헤더 정보 -->
  <header>
    <div class="logo" style="font-size: 3rem;">☕</div>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- [탭 메뉴] 주문하기 / 주문 내역 -->
  <nav class="tab-menu">
    <button type="button" class="tab-btn active" id="tab-order">☕ 주문하기</button>
    <button type="button" class="tab-btn" id="tab-history">
      📋 주문 내역 <span id="order-count-badge" class="badge">0</span>
    </button>
  </nav>

  <main>
    <!-- [탭 1: 주문하기 화면] -->
    <section id="order-panel">
      <!-- [주문서] 주문 폼 (JavaScript로 유효성 검사를 수행하기 위해 novalidate 적용) -->
      <form id="order-form" novalidate>
      <!-- 1. 이름 (필수, text) -->
      <div>
        <label for="customer-name">이름</label>
        <input type="text" id="customer-name" name="customerName" required>
      </div>

      <!-- 2. 전화번호 (tel) -->
      <div>
        <label for="customer-phone">전화번호</label>
        <input type="tel" id="customer-phone" name="customerPhone">
      </div>

      <!-- 3. 음료 선택 (드롭다운) -->
      <div>
        <label for="beverage">음료 선택</label>
        <select id="beverage" name="beverage">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 3,500원</option>
          <option value="latte" data-price="4000">카페라떼 4,000원</option>
          <option value="mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
          <option value="iced-tea" data-price="3500">아이스티 3,500원</option>
          <option value="lemonade" data-price="4500">레몬에이드 4,500원</option>
        </select>
      </div>

      <!-- 4. 사이즈 (라디오) -->
      <fieldset>
        <legend>사이즈</legend>
        <div>
          <input type="radio" id="size-s" name="size" value="s" data-price="0">
          <label for="size-s">S +0원</label>
        </div>
        <div>
          <input type="radio" id="size-m" name="size" value="m" data-price="500" checked>
          <label for="size-m">M +500원</label>
        </div>
        <div>
          <input type="radio" id="size-l" name="size" value="l" data-price="1000">
          <label for="size-l">L +1,000원</label>
        </div>
      </fieldset>

      <!-- 5. 추가 옵션 (체크박스) -->
      <fieldset>
        <legend>추가 옵션</legend>
        <div>
          <input type="checkbox" id="opt-shot" name="options" value="shot" data-price="500">
          <label for="opt-shot">샷 추가 +500원</label>
        </div>
        <div>
          <input type="checkbox" id="opt-cream" name="options" value="cream" data-price="500">
          <label for="opt-cream">크림 추가 +500원</label>
        </div>
        <div>
          <input type="checkbox" id="opt-syrup" name="options" value="syrup" data-price="300">
          <label for="opt-syrup">시럽 추가 +300원</label>
        </div>
        <div>
          <input type="checkbox" id="opt-decaf" name="options" value="decaf" data-price="0">
          <label for="opt-decaf">디카페인 +0원</label>
        </div>
        <div>
          <input type="checkbox" id="opt-ice" name="options" value="ice" data-price="300">
          <label for="opt-ice">얼음 추가 +300원</label>
        </div>
      </fieldset>

      <!-- 6. 수량 (number) -->
      <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <!-- 7. 요청사항 (textarea) -->
      <div>
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests" rows="4"></textarea>
      </div>

      <!-- 8. 예상 금액 표시 영역 -->
      <div id="price-display-area">
        예상 금액: <span id="total-price">0</span>원
      </div>

      <!-- 9 & 10. 주문하기 및 다시 작성 버튼 -->
      <div>
        <button type="submit" id="submit-btn">주문하기</button>
        <button type="reset" id="reset-btn">다시 작성</button>
      </div>
    </form>

    <!-- 11. 주문 확인 메시지가 나올 빈 영역 (초기 상태 숨김) -->
    <div id="order-confirmation" hidden></div>
  </section>

  <!-- [탭 2: 주문 내역 화면 (초기에는 숨김)] -->
  <section id="history-panel" class="hidden">
    <!-- 주문 내역 목록 영역 -->
    <div id="order-list" class="order-list"></div>

    <!-- 하단 주문 내역 요약 및 전체 삭제 버튼 -->
    <div id="history-summary-area" class="history-summary-area hidden">
      <p id="history-total-price" class="history-total-price">총 주문 금액: 0원 (0건)</p>
      <button type="button" id="clear-history-btn" class="clear-history-btn">내역 모두 지우기</button>
    </div>
  </section>
</main>

  <!-- Supabase JS v2 CDN 라이브러리 연결 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 자바스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
